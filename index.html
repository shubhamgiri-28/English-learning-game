<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Learning Game</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            text-align: center;
        }

        .app {
            max-width: 500px;
            margin: auto;
            padding: 25px 15px;
        }

        h1 {
            font-size: 32px;
        }

        .card {
            background: white;
            color: #222;
            padding: 25px;
            margin: 18px 0;
            border-radius: 22px;
            box-shadow: 0 8px 20px #0005;
        }

        .icon {
            font-size: 65px;
        }

        button {
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
        }

        .reading {
            background: #ff9f43;
            color: white;
        }

        .target {
            background: #10ac84;
            color: white;
        }

        .back {
            background: #576574;
            color: white;
        }

        input {
            width: 90%;
            box-sizing: border-box;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 17px;
            margin: 10px;
        }

        #game {
            display: none;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🎮 My Learning Game</h1>
    <p>Learn English & Play</p>

    <!-- HOME -->
    <div id="home">

        <div class="card">
            <div class="icon">📚</div>
            <h2>Reading Game</h2>
            <p>Read the English word and enter its meaning.</p>

            <button class="reading" onclick="startReading()">
                📖 Start Reading
            </button>
        </div>

        <div class="card">
            <div class="icon">🎯</div>
            <h2>Target Game</h2>
            <p>Guess the hidden number and earn points.</p>

            <button class="target" onclick="startTarget()">
                🎯 Start Target
            </button>
        </div>

        <h3>🏆 Score: <span id="score">0</span></h3>

    </div>


    <!-- GAME -->
    <div id="game">

        <div class="card">

            <div id="gameIcon" class="icon">📚</div>

            <h2 id="gameTitle"></h2>

            <h2 id="question"></h2>

            <input
                id="answer"
                placeholder="Enter your answer"
                autocomplete="off"
            >

            <button class="reading" onclick="checkAnswer()">
                ✅ Submit Answer
            </button>

            <p id="result"></p>

            <button class="back" onclick="goHome()">
                🏠 Home
            </button>

        </div>

    </div>

</div>


<script>

let score = 0;
let currentAnswer = "";
let gameType = "";

const words = [
    ["Apple", "apple"],
    ["Book", "book"],
    ["Water", "water"],
    ["Friend", "friend"],
    ["House", "house"],
    ["Morning", "morning"]
];

function startReading() {

    gameType = "reading";

    document.getElementById("home").style.display = "none";
    document.getElementById("game").style.display = "block";

    document.getElementById("gameIcon").innerHTML = "📚";
    document.getElementById("gameTitle").innerHTML = "Reading Game";

    newReadingQuestion();
}

function newReadingQuestion() {

    let item = words[Math.floor(Math.random() * words.length)];

    document.getElementById("question").innerHTML =
        "📖 Read: " + item[0];

    currentAnswer = item[1];

    document.getElementById("answer").value = "";
    document.getElementById("result").innerHTML = "";
}

function startTarget() {

    gameType = "target";

    document.getElementById("home").style.display = "none";
    document.getElementById("game").style.display = "block";

    document.getElementById("gameIcon").innerHTML = "🎯";
    document.getElementById("gameTitle").innerHTML = "Target Game";

    currentAnswer = Math.floor(Math.random() * 10) + 1;

    document.getElementById("question").innerHTML =
        "🎯 Guess a number from 1 to 10";

    document.getElementById("answer").value = "";
    document.getElementById("result").innerHTML = "";
}

function checkAnswer() {

    let answer =
        document.getElementById("answer").value
        .trim()
        .toLowerCase();

    if (answer === "") {
        document.getElementById("result").innerHTML =
            "⚠️ Please enter an answer.";
        return;
    }

    if (answer == currentAnswer) {

        score++;

        document.getElementById("score").innerHTML = score;

        document.getElementById("result").innerHTML =
            "🎉 Correct! +1 Point";

        setTimeout(function() {

            if (gameType === "reading") {
                newReadingQuestion();
            } else {
                startTarget();
            }

        }, 800);

    } else {

        document.getElementById("result").innerHTML =
            "❌ Wrong! Try again.";
    }
}

function goHome() {

    document.getElementById("game").style.display = "none";
    document.getElementById("home").style.display = "block";

}

</script>

</body>
</html>
