<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Learning Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: white;
    min-height: 100vh;
}

.app {
    max-width: 500px;
    margin: auto;
    padding: 25px 15px;
}

h1 {
    text-align: center;
    font-size: 30px;
}

.card {
    background: white;
    color: #222;
    border-radius: 20px;
    padding: 25px;
    margin-top: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

#question {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 20px;
}

.option {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: none;
    border-radius: 12px;
    background: #eeeeee;
    font-size: 17px;
}

.option:active {
    transform: scale(0.98);
}

#next {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: #2575fc;
    color: white;
    font-size: 18px;
}

#result {
    text-align: center;
    font-weight: bold;
    margin-top: 15px;
}

.score {
    text-align: center;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="app">

<h1>📚 English Learning Game</h1>

<div class="score">
    Score: <span id="score">0</span>
</div>

<div class="card">

<div id="question">Loading...</div>

<div id="options"></div>

<div id="result"></div>

<button id="next" onclick="nextQuestion()">Next Question</button>

</div>

</div>

<script>

const questions = [
    {
        question: "What is the meaning of 'Happy'?",
        options: ["खुश", "गुस्सा", "दुखी", "थका हुआ"],
        answer: "खुश"
    },
    {
        question: "What is the meaning of 'Water'?",
        options: ["पानी", "आग", "हवा", "मिट्टी"],
        answer: "पानी"
    },
    {
        question: "What is the meaning of 'Book'?",
        options: ["किताब", "कुर्सी", "मेज", "कलम"],
        answer: "किताब"
    },
    {
        question: "What is the meaning of 'Beautiful'?",
        options: ["सुंदर", "बड़ा", "छोटा", "तेज"],
        answer: "सुंदर"
    },
    {
        question: "What is the meaning of 'Friend'?",
        options: ["दोस्त", "भाई", "शिक्षक", "पड़ोसी"],
        answer: "दोस्त"
    }
];

let currentQuestion = 0;
let score = 0;

function loadQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("question").innerText = q.question;

    const optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    document.getElementById("result").innerText = "";

    q.options.forEach(option => {

        const button = document.createElement("button");

        button.className = "option";

        button.innerText = option;

        button.onclick = function() {
            checkAnswer(option);
        };

        optionsDiv.appendChild(button);

    });
}

function checkAnswer(selected) {

    const correct = questions[currentQuestion].answer;

    if (selected === correct) {

        score++;

        document.getElementById("score").innerText = score;

        document.getElementById("result").innerText =
            "✅ Correct Answer!";

    } else {

        document.getElementById("result").innerText =
            "❌ Wrong! Correct answer: " + correct;
    }

}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        document.getElementById("question").innerText =
            "🎉 Game Complete!";

        document.getElementById("options").innerHTML =
            "<h2 style='text-align:center'>Your Score: " +
            score + "/" + questions.length +
            "</h2>";

        document.getElementById("result").innerText =
            "Play again to improve your English!";

        document.getElementById("next").innerText = "Restart";

        document.getElementById("next").onclick = function() {
            currentQuestion = 0;
            score = 0;
            document.getElementById("score").innerText = 0;
            document.getElementById("next").innerText = "Next Question";
            document.getElementById("next").onclick = nextQuestion;
            loadQuestion();
        };

        return;
    }

    loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
